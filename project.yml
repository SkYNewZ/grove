name: Grove
options:
  bundleIdPrefix: fr.lemairepro
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  GroveKit:
    path: Packages/GroveKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
targets:
  Grove:
    type: application
    platform: macOS
    sources:
      - Grove
    dependencies:
      - package: GroveKit
        product: GroveKit
    info:
      path: Grove/Info.plist
      properties:
        CFBundleDisplayName: Grove
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© Quentin Lemaire"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.lemairepro.grove
        PRODUCT_NAME: Grove
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
