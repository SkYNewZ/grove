name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Lint
        run: swift format lint --strict -r Packages Grove
      - name: Test
        run: swift test --package-path Packages/GroveKit
      - name: Build app
        run: |
          brew install xcodegen
          xcodegen generate --quiet
          xcodebuild -scheme Grove -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO -quiet build
